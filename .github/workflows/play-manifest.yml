name: Play release manifest
on:
  push:
    branches: [main]
    paths: ['scripts/prepare-play-release*.mjs', 'release-notes/**', '.github/workflows/play-manifest.yml']
  pull_request:
    paths: ['scripts/prepare-play-release*.mjs', 'release-notes/**', '.github/workflows/play-manifest.yml']
permissions:
  contents: read
jobs:
  manifest-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test scripts/prepare-play-release.test.mjs
